<div class="login-container">
  <div class="login-card">
    <div class="brand">
      <span class="material-icons brand-icon">health_and_safety</span>
      <h2>FisioSmart</h2>
      <p>Plataforma de Fisioterapia Remota Inteligente</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="error-alert" *ngIf="errorMessage">
        <span class="material-icons">error_outline</span>
        <span class="alert-text">{{ errorMessage }}</span>
      </div>

      <div class="success-alert" *ngIf="successMessage">
        <span class="material-icons">check_circle_outline</span>
        <span class="alert-text">{{ successMessage }}</span>
      </div>

      <!-- Registration Fields -->
      <div class="form-group" *ngIf="!isLoginMode">
        <label for="name">Nombre Completo</label>
        <div class="input-wrapper">
          <span class="material-icons input-icon">person</span>
          <input 
            type="text" 
            id="name" 
            name="name" 
            [(ngModel)]="nombre" 
            placeholder="Ej. Juan Pérez" 
            required 
            #nameInput="ngModel">
        </div>
      </div>

      <!-- General Fields -->
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <div class="input-wrapper">
          <span class="material-icons input-icon">email</span>
          <input 
            type="email" 
            id="email" 
            name="email" 
            [(ngModel)]="correo" 
            placeholder="ejemplo@correo.com" 
            required 
            #emailInput="ngModel">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <span class="material-icons input-icon">lock</span>
          <input 
            type="password" 
            id="password" 
            name="password" 
            [(ngModel)]="password" 
            placeholder="Mínimo 6 caracteres" 
            required 
            #passwordInput="ngModel">
        </div>
      </div>

      <!-- Role Selection (Register only) -->
      <div class="form-group" *ngIf="!isLoginMode">
        <label for="role">Tipo de Usuario</label>
        <div class="role-selector">
          <label class="role-option" [class.active]="rol === 'PACIENTE'">
            <input type="radio" name="role" [(ngModel)]="rol" value="PACIENTE">
            <span class="material-icons">badge</span>
            <span>Paciente</span>
          </label>
          <label class="role-option" [class.active]="rol === 'MEDICO'">
            <input type="radio" name="role" [(ngModel)]="rol" value="MEDICO">
            <span class="material-icons">local_hospital</span>
            <span>Fisioterapeuta</span>
          </label>
        </div>
      </div>

      <button type="submit" class="submit-btn" [disabled]="!loginForm.form.valid">
        <span>{{ isLoginMode ? 'Iniciar Sesión' : 'Registrarse' }}</span>
        <span class="material-icons">arrow_forward</span>
      </button>
    </form>

    <div class="toggle-mode">
      <p *ngIf="isLoginMode">
        ¿No tienes cuenta? 
        <a (click)="toggleMode()">Regístrate aquí</a>
      </p>
      <p *ngIf="!isLoginMode">
        ¿Ya tienes cuenta? 
        <a (click)="toggleMode()">Inicia sesión</a>
      </p>
    </div>
  </div>
</div>
